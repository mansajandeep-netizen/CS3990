<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Manitoba Flag - Red background -->
  <rect width="600" height="300" fill="#CE1126"/>
  
  <!-- Union Jack (top left canton) -->
  <g>
    <rect width="300" height="150" fill="#012169"/>
    
    <!-- White diagonals -->
    <path d="M 0 0 L 300 150 M 300 0 L 0 150" stroke="#ffffff" stroke-width="25"/>
    
    <!-- Red diagonals -->
    <path d="M 0 0 L 300 150 M 300 0 L 0 150" stroke="#C8102E" stroke-width="15"/>
    
    <!-- White cross -->
    <path d="M 150 0 L 150 150 M 0 75 L 300 75" stroke="#ffffff" stroke-width="40"/>
    
    <!-- Red cross -->
    <path d="M 150 0 L 150 150 M 0 75 L 300 75" stroke="#C8102E" stroke-width="24"/>
  </g>
  
  <!-- Shield/Coat of Arms (simplified) -->
  <g transform="translate(450, 150)">
    <rect x="-50" y="-60" width="100" height="120" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Red cross -->
    <rect x="-45" y="-50" width="90" height="15" fill="#CE1126"/>
    <rect x="-7.5" y="-50" width="15" height="100" fill="#CE1126"/>
    
    <!-- Buffalo (simplified) -->
    <ellipse cx="0" cy="20" rx="30" ry="20" fill="#654321"/>
    <circle cx="-15" cy="10" r="8" fill="#654321"/>
    <circle cx="-18" cy="8" r="2" fill="#000000"/>
  </g>
</svg>
