<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Prince Edward Island Flag - White background -->
  <rect width="600" height="300" fill="#ffffff"/>
  
  <!-- Red and white stripes (alternating) - top -->
  <rect y="0" width="600" height="40" fill="#CE1126"/>
  <rect y="40" width="600" height="40" fill="#ffffff"/>
  <rect y="80" width="600" height="40" fill="#CE1126"/>
  
  <!-- Bottom stripes -->
  <rect y="180" width="600" height="40" fill="#CE1126"/>
  <rect y="220" width="600" height="40" fill="#ffffff"/>
  <rect y="260" width="600" height="40" fill="#CE1126"/>
  
  <!-- Shield in center -->
  <g transform="translate(300, 150)">
    <path d="M -70,-60 L -70,30 Q -70,50 0,65 Q 70,50 70,30 L 70,-60 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Top section - Lion (simplified) -->
    <rect x="-65" y="-55" width="130" height="40" fill="#CE1126"/>
    <circle cx="-30" cy="-35" r="12" fill="#FFD700"/>
    <circle cx="-33" cy="-38" r="2" fill="#000000"/>
    <ellipse cx="-20" cy="-30" rx="15" ry="10" fill="#FFD700"/>
    
    <!-- Middle section - Large oak tree -->
    <rect x="-65" y="-15" width="130" height="40" fill="#ffffff"/>
    <!-- Tree trunk -->
    <rect x="-8" y="5" width="16" height="30" fill="#654321"/>
    <!-- Tree foliage (simplified) -->
    <circle cx="0" cy="-5" r="20" fill="#228B22"/>
    <circle cx="-15" cy="0" r="15" fill="#228B22"/>
    <circle cx="15" cy="0" r="15" fill="#228B22"/>
    
    <!-- Bottom section - Three saplings (small trees) -->
    <rect x="-65" y="25" width="130" height="35" fill="#228B22"/>
    <!-- Left sapling -->
    <rect x="-40" y="40" width="4" height="15" fill="#654321"/>
    <circle cx="-38" cy="38" r="6" fill="#90EE90"/>
    <!-- Middle sapling -->
    <rect x="-2" y="40" width="4" height="15" fill="#654321"/>
    <circle cx="0" cy="38" r="6" fill="#90EE90"/>
    <!-- Right sapling -->
    <rect x="36" y="40" width="4" height="15" fill="#654321"/>
    <circle cx="38" cy="38" r="6" fill="#90EE90"/>
  </g>
</svg>
