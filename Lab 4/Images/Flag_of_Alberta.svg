<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Alberta Flag - Blue background -->
  <rect width="600" height="300" fill="#0033A0"/>
  
  <!-- Shield -->
  <g transform="translate(300, 150)">
    <!-- Shield background -->
    <path d="M -80,-100 L -80,60 Q -80,100 0,120 Q 80,100 80,60 L 80,-100 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Red St George's Cross -->
    <rect x="-70" y="-90" width="140" height="30" fill="#CE1126"/>
    <rect x="-15" y="-90" width="30" height="180" fill="#CE1126"/>
    
    <!-- Landscape scene -->
    <!-- Sky -->
    <rect x="-70" y="-60" width="140" height="50" fill="#87CEEB"/>
    
    <!-- Mountains -->
    <path d="M -70,-10 L -40,-40 L -10,-10 Z" fill="#8B4513"/>
    <path d="M -30,-10 L 0,-45 L 30,-10 Z" fill="#654321"/>
    <path d="M 10,-10 L 40,-35 L 70,-10 Z" fill="#8B4513"/>
    
    <!-- Prairie (green and yellow stripes) -->
    <rect x="-70" y="-10" width="140" height="20" fill="#228B22"/>
    <rect x="-70" y="10" width="140" height="20" fill="#FFD700"/>
    <rect x="-70" y="30" width="140" height="20" fill="#228B22"/>
  </g>
</svg>
