<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- New Brunswick Flag - Red background -->
  <rect width="600" height="300" fill="#CE1126"/>
  
  <!-- Yellow/Gold section (top) -->
  <rect width="600" height="100" fill="#FFD700"/>
  
  <!-- Ship (simplified galley) -->
  <g transform="translate(300, 50)">
    <!-- Hull -->
    <path d="M -40,20 Q -40,10 -30,10 L 30,10 Q 40,10 40,20 L 30,30 L -30,30 Z" fill="#8B4513" stroke="#000000" stroke-width="1"/>
    
    <!-- Mast -->
    <rect x="-2" y="-25" width="4" height="45" fill="#654321"/>
    
    <!-- Sail -->
    <path d="M 0,-25 L 25,-15 L 25,5 L 0,15 Z" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    
    <!-- Oars (simplified) -->
    <line x1="-35" y1="15" x2="-55" y2="25" stroke="#654321" stroke-width="2"/>
    <line x1="35" y1="15" x2="55" y2="25" stroke="#654321" stroke-width="2"/>
  </g>
  
  <!-- Shield -->
  <g transform="translate(300, 200)">
    <path d="M -50,-50 L -50,20 Q -50,40 0,50 Q 50,40 50,20 L 50,-50 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Lion (simplified) -->
    <ellipse cx="0" cy="0" rx="25" ry="20" fill="#CE1126"/>
    <circle cx="-10" cy="-10" r="10" fill="#CE1126"/>
    <circle cx="-12" cy="-12" r="2" fill="#000000"/>
    <path d="M 15,10 L 25,15" stroke="#CE1126" stroke-width="4"/>
  </g>
</svg>
