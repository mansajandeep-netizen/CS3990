<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Yukon Flag -->
  
  <!-- Three vertical stripes -->
  <!-- Green (left) -->
  <rect width="200" height="300" fill="#00843D"/>
  
  <!-- White (middle) -->
  <rect x="200" width="200" height="300" fill="#ffffff"/>
  
  <!-- Blue (right) -->
  <rect x="400" width="200" height="300" fill="#0072CE"/>
  
  <!-- Coat of Arms (simplified) in center -->
  <g transform="translate(300, 150)">
    <!-- Shield -->
    <path d="M -50,-60 L -50,25 Q -50,45 0,55 Q 50,45 50,25 L 50,-60 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Top section - Red cross (St George's Cross) -->
    <rect x="-45" y="-55" width="90" height="13" fill="#CE1126"/>
    <rect x="-6.5" y="-55" width="13" height="45" fill="#CE1126"/>
    
    <!-- Middle section - Stylized mountains and fur trade -->
    <!-- Blue background for mountains -->
    <rect x="-45" y="-10" width="90" height="25" fill="#0072CE"/>
    <!-- Mountains (white peaks) -->
    <path d="M -35,15 L -20,-5 L -5,15 Z" fill="#ffffff"/>
    <path d="M -5,15 L 10,-8 L 25,15 Z" fill="#ffffff"/>
    <path d="M 25,15 L 35,-3 L 45,15 Z" fill="#ffffff"/>
    
    <!-- Bottom section - Gold (representing gold rush) -->
    <rect x="-45" y="15" width="90" height="35" fill="#FFD700"/>
    
    <!-- Malamute dog (simplified) on gold background -->
    <ellipse cx="0" cy="32" rx="18" ry="12" fill="#654321"/>
    <circle cx="-8" cy="25" r="6" fill="#654321"/>
    <circle cx="-10" cy="24" r="2" fill="#000000"/>
  </g>
  
  <!-- Floral emblem above shield (fireweed - simplified) -->
  <g transform="translate(300, 85)">
    <circle cx="0" cy="0" r="8" fill="#E535AB"/>
    <circle cx="-6" cy="-6" r="6" fill="#E535AB"/>
    <circle cx="6" cy="-6" r="6" fill="#E535AB"/>
    <circle cx="-6" cy="6" r="6" fill="#E535AB"/>
    <circle cx="6" cy="6" r="6" fill="#E535AB"/>
  </g>
</svg>
