<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Northwest Territories Flag -->
  
  <!-- Blue background -->
  <rect width="600" height="300" fill="#0072CE"/>
  
  <!-- White panels (left and right) -->
  <rect width="200" height="300" fill="#ffffff"/>
  <rect x="400" width="200" height="300" fill="#ffffff"/>
  
  <!-- Shield in center -->
  <g transform="translate(300, 150)">
    <path d="M -60,-70 L -60,30 Q -60,50 0,65 Q 60,50 60,30 L 60,-70 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Top section - wavy blue line representing water -->
    <rect x="-55" y="-65" width="110" height="35" fill="#ffffff"/>
    <path d="M -55,-47 Q -40,-52 -25,-47 T 5,-47 T 35,-47 T 55,-47" stroke="#0072CE" stroke-width="6" fill="none"/>
    <rect x="-55" y="-40" width="110" height="10" fill="#0072CE"/>
    
    <!-- Middle section - Red diagonal (representing minerals) -->
    <path d="M -55,-30 L 55,15" stroke="#CE1126" stroke-width="25"/>
    
    <!-- Bottom section - Green representing forests -->
    <rect x="-55" y="15" width="110" height="40" fill="#00843D"/>
    
    <!-- Gold bars (representing gold) -->
    <rect x="-40" y="20" width="15" height="8" fill="#FFD700"/>
    <rect x="-20" y="20" width="15" height="8" fill="#FFD700"/>
    <rect x="0" y="20" width="15" height="8" fill="#FFD700"/>
    <rect x="20" y="20" width="15" height="8" fill="#FFD700"/>
    
    <!-- Arctic fox (white) at bottom -->
    <ellipse cx="0" cy="42" rx="20" ry="10" fill="#ffffff"/>
    <circle cx="-10" cy="36" r="6" fill="#ffffff"/>
    <circle cx="-12" cy="34" r="2" fill="#000000"/>
  </g>
</svg>
